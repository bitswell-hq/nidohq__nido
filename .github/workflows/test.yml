name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  contracts:
    name: Contracts (cargo test --workspace)
    runs-on: ubuntu-latest
    steps:
      # vendor/perch (a submodule): Perch's deployment manifest and the fetch
      # script `just perch-infra` runs, the drift check, and the ZK circuits
      # and toolchain `just gen-zk-fixtures` uses. Cargo takes Perch's crates
      # as git dependencies at the same commit.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Pinned to match the workspace-root rust-toolchain.toml (keep the two in
      # lockstep) so contract wasm bytecode is reproducible rather than built
      # against whatever `stable` happens to be on the runner that day.
      # `wasm32v1-none` is the target the contract wasms compile for.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: contracts

      # Every CLI installs from a prebuilt release binary -- no
      # compile-from-source, no dedicated tool cache, no cache-miss cliff.
      # `just` has first-class install-action support; `stellar-cli` (binary
      # `stellar`, which `just perch-infra` uses to fetch Perch's deployed
      # wasm) and `stellar-scaffold-cli` (binary `stellar-scaffold`) aren't in
      # the install-action manifest, so it falls back to cargo-binstall, which
      # fetches each project's official GitHub release tarball -- both ship
      # `[package.metadata.binstall]`, so the resolved asset
      # (e.g. stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz) is a signed
      # release artifact rather than a source build. Versions are pinned to
      # what the previous unpinned `cargo install --locked` resolved to today,
      # so this changes the install method, not the tool version. The prebuilt
      # `stellar` binary needs no libdbus/libudev `-dev` headers (those only
      # existed to compile the hardware-wallet source deps).
      - name: Install just + Stellar CLIs (prebuilt release binaries)
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just,stellar-cli@28.1.0,stellar-scaffold-cli@0.0.27

      # Perch's testnet deployment, by the hashes in its manifest
      # (vendor/perch/deployments/testnet.json): every deployed contract's
      # wasm, each refused unless its sha256 and content address match.
      - name: Fetch Perch's deployed stack
        run: just perch-infra

      # Nido's own contracts; the factory embeds the fetched Perch account.
      - name: Build contract wasms
        run: just build-contracts

      # The grant evaluator (crates/grant-eval) is a no_std library, not a
      # contract, so the scaffold build skips it; it must still compile for
      # the contract target the smart account links it into.
      - name: Build grant-eval for wasm32v1-none
        run: cargo build -p grant-eval --target wasm32v1-none --release

      # The vendored Perch stack can't silently diverge from what Nido
      # consumes: submodule pin and branch, Cargo's Perch rev, the fetched
      # wasm, build-time pins, and factory embed against the manifest
      # (scripts/check-perch-drift.sh).
      - name: Check vendor/perch for drift
        run: just check-vendor-drift

      # The whole Rust workspace: the factory, the policy contracts, and the
      # integration suites that drive the deployed Perch account, verifier,
      # controller, pool, and adapter wasm under enforcing authorization, replaying the committed
      # real UltraHonk proofs (crates/integration-tests/fixtures/zk/), and the
      # `costs` suite's 75%-of-network-limit budget gate.
      - name: cargo test --workspace
        run: cargo test --workspace

      # Re-prove every committed fixture from source with Perch's pinned,
      # checksum-verified nargo/bb (vendor/perch/scripts/zk-toolchain.sh); each
      # fresh proof must verify through the deployed adapter. The proofs are
      # zero-knowledge, so their bytes differ on every run, but each fixture's
      # statement digest, root, and nullifier must not: a diff there means a
      # statement changed without the fixtures being regenerated.
      - name: Reproduce the real-proof fixtures
        run: |
          just gen-zk-fixtures
          git diff --exit-code -- 'crates/integration-tests/fixtures/zk/*/fixture.json'

      # The DKIM key registry's key hashes, leaves, and roots recomputed in
      # Noir with the email circuit's Poseidon2 (noir-lang/poseidon v0.2.0),
      # with Perch's pinned nargo; the contract's `noir_vectors` unit test
      # asserts the same values from the host's Poseidon2.
      - name: Cross-check the DKIM registry hashing against Noir
        run: just dkim-registry-vectors

      # The email proofs (crates/integration-tests/fixtures/email/) need the
      # provider mocks and the encoder, which run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install npm dependencies
        run: npm install

      # Re-prove every email fixture from source: compile the recovery circuit
      # with Perch's pinned nargo/bb, write its key, rebuild the verifier,
      # generate each recovery email with the provider mocks, encode and prove
      # it, and verify it through the deployed verifier. The proofs differ on
      # every run; the circuit artifact, the key, the provider keys, every
      # email and every fixture's statement, inputs and key path must not.
      - name: Reproduce the email proof fixtures
        run: |
          just gen-email-proofs
          git diff --exit-code -- circuits/email-recovery/artifacts contracts/email-verifier/vk \
            circuits/email-recovery/recovery/Prover.toml crates/integration-tests/fixtures/email/keys.json \
            'crates/integration-tests/fixtures/email/*/fixture.json' 'crates/integration-tests/fixtures/email/*/message.eml'

  agent-host:
    name: Agent host (${{ matrix.os }})
    # crates/agent-host is its own workspace (its README says why), so the
    # contracts job's `cargo test --workspace` does not reach it. macOS runs
    # the case-insensitive file system cases (APFS folds case by default).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The same pinned toolchain as the contracts job; build.rs compiles the
      # evaluator component for wasm32v1-none.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/agent-host -> target

      - name: cargo fmt --check
        run: cargo fmt --manifest-path crates/agent-host/Cargo.toml --all -- --check

      - name: cargo clippy (pedantic)
        run: cargo clippy --manifest-path crates/agent-host/Cargo.toml --all --tests -- -Dclippy::pedantic

      - name: cargo test
        run: cargo test --manifest-path crates/agent-host/Cargo.toml

      # The evaluation's agent-host program (evaluation/agent-host) is its own
      # workspace beside this one; it shares this target directory.
      - name: Evaluation program (fmt, clippy pedantic)
        run: |
          cargo fmt --manifest-path evaluation/agent-host/Cargo.toml --all -- --check
          cargo clippy --manifest-path evaluation/agent-host/Cargo.toml --target-dir crates/agent-host/target --all --tests -- -Dclippy::pedantic

  unit:
    name: Unit (TestAuthenticator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/perch: the npm workspace includes its packages.
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Unit tests (shim crypto vs SDK parsers)
        run: npx vitest run --config vitest.support.config.ts
      # The SDK's Perch layer against Perch's statement vectors and Nido's
      # real-proof fixtures (including one bb.js proof compared byte for byte
      # with the committed CLI proof).
      - name: SDK Perch parity (statement encodings, ZK proving)
        run: npx vitest run --root packages/passkey-sdk src/perch
      # TEST-ONLY mocks of the launch mail providers: every honest fixture
      # must verify under mailauth (pinned, strict) against the mock DNS, every
      # attack case must get its expected verifier result, and every observed
      # provider signature layout must be reproduced line for line.
      - name: Email provider mocks (DKIM fixtures vs mailauth)
        run: |
          npx tsc -p packages/email-mocks/tsconfig.test.json
          npx vitest run --root packages/email-mocks
      # The recovery alert service: the browser helpers (alert code, Nitro
      # attestation, sealed and passkey-authorized contacts), the vault and
      # the watcher against the TEST-ONLY third-party mocks, and the end-to-end
      # run over the chain record of crates/integration-tests (email_alerts.rs)
      # with the vault in its own process.
      - name: Email alerts (browser helpers, vault, watcher, end to end on mocks)
        run: |
          npm run build -w @nidohq/email-recovery -w @nidohq/email-mocks -w @nidohq/email-alerts
          npx tsc -p packages/email-recovery/tsconfig.test.json
          npx vitest run --root packages/email-recovery
          npx tsc -p infra/email-alerts/tsconfig.test.json
          npx vitest run --root infra/email-alerts

  e2e:
    name: E2E (fast UI + CDP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/perch: the npm workspace includes its packages.
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers + system deps
        run: npx playwright install --with-deps chromium firefox webkit
      # Mirrors the deploy/preview workflows: build the SDK, then the frontend,
      # so the static webServer serves a real dist for the e2e tiers.
      - name: Build passkey-sdk
        run: npx tsc -p ./packages/passkey-sdk/tsconfig.json
      # The fast tiers never reach a chain, so the build has no Perch
      # deployment and the recovery pages say so (recovery-pages.spec.ts).
      - name: Build frontend
        env:
          PUBLIC_PERCH_DEPLOYMENT: none
        run: npx astro build --root ./packages/frontend
      - name: Fast UI e2e tier (shim — chromium/firefox/webkit)
        run: npx playwright test --grep @fast
      - name: Chromium CDP virtual-authenticator fidelity lane
        run: npx playwright test --project=chromium-cdp
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    # ADVISORY, non-blocking for now (every step is continue-on-error) so a
    # freshly-published advisory in a transitive dep can't red-wall unrelated
    # PRs. Triage the findings, then flip these to gating before mainnet (see
    # docs/SUPPLY_CHAIN.md). Dependabot (.github/dependabot.yml) opens the
    # actual update PRs; this job is the at-a-glance "any known CVEs right now"
    # signal in the Checks tab.
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/perch: the npm workspace includes its packages.
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # cargo-audit reads Cargo.lock against the RustSec advisory DB -- no
      # workspace build needed, so this is fast.
      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit

      - name: cargo audit (advisory)
        continue-on-error: true
        run: cargo audit

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm audit works straight off each committed package-lock.json (no
      # install needed). Loop the authored roots; keep going on findings.
      - name: npm audit (advisory)
        continue-on-error: true
        run: |
          for d in . packages/passkey-sdk packages/frontend packages/stellar-wallets-kit-module \
                   infra/nido-resolver; do
            echo "== npm audit: $d =="
            (cd "$d" && npm audit --audit-level=high) || true
          done
