[package]
name = "nido-key-keeper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Sign-with-key-K interface for agents that hold no keys: an in-process keeper, a Dfns Keys API client, and a local Dfns mock."

[lib]
doctest = false

[[bin]]
name = "dfns-mock"
path = "src/bin/dfns-mock.rs"

[dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
base64 = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stellar-xdr = { version = "28", default-features = false, features = ["std"] }
stellar-strkey = "0.0.13"
getrandom = "0.2"
ureq = "3"
tiny_http = "0.12"
