[package]
name = "nido-dns-attestation-mock"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "dns-attestation-mock"
path = "src/main.rs"

[dependencies]
# The registry's own key hash, computed through the host's Poseidon2 in an
# in-process `Env` (testutils), exactly as `propose_add` computes it.
nido-dkim-registry = { path = "../../contracts/dkim-registry" }
soroban-sdk = { workspace = true, features = ["testutils"] }
perch-zk-primitives = { workspace = true }
ed25519-dalek = "2.2"
sha2 = "0.10"
base64 = { workspace = true }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
