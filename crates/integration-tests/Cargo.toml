[package]
name = "nido-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
# Soroban. "hazmat-address" exposes `Address::to_payload`, the public way to
# read an `Address`'s raw 32-byte contract id (the ZK statement binds it).
soroban-sdk = { workspace = true, features = ["testutils", "hazmat-address"] }
stellar-accounts = { workspace = true }
# `ContractError::into_code()` for error-code assertions against scerr enums.
soroban-sdk-tools = { workspace = true }

# The Perch stack under test (git dependencies, root Cargo.toml). The deployables run from their
# deployed wasm (`just perch-infra`); these crates provide the typed clients,
# error enums, statement types, and the native ZK witness/proving helpers.
perch-account = { workspace = true }
perch-smart-account = { workspace = true }
perch-recovery = { workspace = true }
perch-recovery-interface = { workspace = true }
perch-doc-compiler = { workspace = true }
perch-interpreter = { workspace = true }
perch-zk-pool = { workspace = true }
perch-zk-prover = { workspace = true }
perch-zk-primitives = { workspace = true }
perch-ir = { workspace = true }
# The email guardian's types and client; the contract itself runs from its
# wasm (`EMAIL_GUARDIAN_WASM`).
nido-email-guardian = { path = "../../contracts/email-guardian" }
# The DKIM key registry's types, client, and hashing (the contract runs from
# its wasm, `DKIM_REGISTRY_WASM`), and the TEST-ONLY DNS attester mock that
# feeds it.
nido-dkim-registry = { path = "../../contracts/dkim-registry" }
nido-dns-attestation-mock = { path = "../dns-attestation-mock" }
# The host's Poseidon2 sponge, for the email circuit's public inputs computed
# natively (`email_proof`).
soroban-poseidon = { workspace = true }
# The host soroban-sdk runs (the version it locks), for its recording-mode
# invocation and fee functions (`transaction`).
soroban-env-host = { version = "=27.0.1", features = ["recording_mode"] }
# The enclave-image registry's client; the contract runs from its wasm
# (`ENCLAVE_IMAGE_REGISTRY_WASM`).
nido-enclave-image-registry = { path = "../../contracts/enclave-image-registry" }

# Crypto
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"

# Encoding
base64 = { workspace = true }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The preauth-sweep-policy scoping tests import `PreauthSweepParams` (to build
# the install map) and `SweepError` (to assert exact rejection codes). This
# crate is not a `#[contract]`/cdylib, so linking the rlib causes no wasm-export
# collision; the policy under test is still deployed from its wasm bytes.
nido-preauth-sweep-policy = { path = "../../contracts/preauth-sweep-policy" }
# The grant signer's types, errors and client; the contract runs from its
# wasm (`GRANT_SIGNER_WASM`). ed25519-dalek signs as the agents' grant keys.
nido-grant-signer = { path = "../../contracts/grant-signer" }
ed25519-dalek = "2.2"
# The relay's XDR-to-action mapping (the agent-host boundary's wiring), which
# the grant signer's mapping must agree with byte for byte.
grant-relay = { path = "../grant-relay" }
grant-eval = { path = "../grant-eval" }
# Reads the registry wasm's imports and exports for the immutability test
# (the version soroban-env-host already locks).
wasmparser = "0.116"
