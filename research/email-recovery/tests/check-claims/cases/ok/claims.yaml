claims:
  - id: a-proven
    statement: Proven thing.
    status: proven
    evidence:
      lean: Fixture.email_sound
      file: formal/Fixture.lean
  - id: a-tested
    statement: Tested thing.
    status: tested
    evidence:
      test: rejects_wrong_account
      file: tests/fixture_test.rs
  - id: a-measured
    statement: Measured thing.
    status: measured
    evidence:
      file: eval/verify.json
  - id: a-measured-figures
    statement: A vote uses 121,639,784 instructions and writes 1,208 bytes, 12 entries, about 97,000 per context.
    status: measured
    evidence:
      file: eval/figures.json
  - id: a-assumed
    statement: Assumed thing.
    status: assumed
    evidence:
      assumption: Something holds.
  - id: a-unproven
    statement: Open thing.
    status: unproven
  - id: a-proven-list
    statement: Proven by two theorems.
    status: proven
    evidence:
      - lean: Fixture.email_sound
        file: formal/Fixture.lean
      - lean: Fixture.email_sound
        file: formal/Fixture.lean
  - id: a-proven-dotted
    statement: Proven by a theorem declared with a dotted name.
    status: proven
    evidence:
      lean: Outer.Ns.dotted_thm
      file: formal/Fixture.lean
