# Claim ledger for the email-recovery paper and slides.
#
# One entry per claim the documents make. \claim{id} renders the status tag
# and \claimstatement{id} the statement, so both documents word a claim the
# same way. check-claims.pl enforces the format; README.md describes it.
#
# status: proven | tested | measured | assumed | unproven
# evidence, by status (paths relative to the repository root):
#   proven    { lean: <theorem name>, file: <.lean path> }
#   tested    { test: <test name>,    file: <test file path> }
#   measured  { file: <measurement file path> }
#   assumed   { assumption: <the stated assumption> }
#   unproven  (none)

claims:
  # The four properties of the email factor, proven in Lean, privacy in its
  # ideal model (research/email-recovery/formal/README.md).
  - id: email-factor-soundness
    statement: >-
      If the email guardian accepts an approval, then for every extractor,
      unless the extractor fails on that accepted proof, the extracted witness
      is an email whose signed header carries a valid RSA-2048 DKIM signature
      under a key whose leaf for the From domain is in the tree of the
      unexpired pin or of a root the registry accepts; whose From address,
      with the account code, opens the account's commitment; and whose Subject
      opens to the digest of a recovery statement naming this account,
      controller and network, an allowed action and an unexpired bound. With
      an honest registry and enrollment, the From address and account code are
      the enrolled ones and the signing modulus is a listed key of the From
      domain, unless Poseidon2 collides on a pair of inputs, or maps an input
      to zero, that the theorem computes from the email, the enrollment and
      the key tree.
    status: proven
    evidence:
      lean: EmailRecovery.soundness
      file: research/email-recovery/formal/EmailRecovery/Soundness.lean

  - id: address-privacy
    statement: >-
      In an ideal model where the commitment and the pin root are handles
      drawn independently of the secret and every honest proof is a
      simulator's output on its public inputs, an adversary that chooses every
      transaction and asks the wallet for approvals of statements of its
      choice sees a view (the guardian's configuration, every approval with
      its proof, every transaction, verdict, state and event) that a simulator
      computes from the handles and the public statements alone, so two
      wallets with different addresses and account codes give the same view.
      Without the ideal model, for any fixed sequence of transactions, the
      contracts' state, verdicts and events depend on the address only through
      the salted commitment and the salted pin root.
    status: proven
    evidence:
      - lean: EmailRecovery.privacy_simulation
        file: research/email-recovery/formal/EmailRecovery/Privacy.lean
      - lean: EmailRecovery.structural_noninterference
        file: research/email-recovery/formal/EmailRecovery/Privacy.lean

  - id: replay-resistance
    statement: >-
      An approval is accepted only in a context naming its own statement
      digest, which fixes one account, network, controller, action, attempt or
      request id and epoch unless the two statements' encodings are a SHA-256
      collision; the controller counts the email guardian at most once per
      attempt and domain or per change digest, so a copy submitted by anyone
      records the same single vote.
    status: proven
    evidence:
      lean: EmailRecovery.Perch.email_vote_replay
      file: research/email-recovery/formal/EmailRecovery/Replay.lean

  - id: one-factor-safety
    statement: >-
      With approvals by the email guardian as the only evidence, an attempt is
      authorized only under a guardian-only configuration with quorum one, and
      a recovery completes only after a positive delay has passed since its
      authorization.
    status: proven
    evidence:
      lean: EmailRecovery.Perch.one_factor_safety
      file: research/email-recovery/formal/EmailRecovery/OneFactor.lean

  - id: wallet-policy-one-factor
    statement: >-
      Under the wallet policy, the email guardian alone reaches the quorum only
      under the loss profile, with a delay lasting at least seven days at the
      network's target ledger close time when the configuration was built
      (120,960 ledgers at 5-second ledgers), and a second alert channel.
    status: proven
    evidence:
      lean: EmailRecovery.Perch.one_factor_under_wallet_policy
      file: research/email-recovery/formal/EmailRecovery/WalletPolicy.lean

  - id: model-code-agreement
    statement: >-
      The Lean model's statement encoding matches the code: Perch's encoder
      reproduces independent vectors, and the guardian's parser reads every
      statement shape that encoder produces.
    status: tested
    evidence:
      test: statement_parser_reads_perch_encodings
      file: contracts/email-guardian/src/test.rs

  # Nido's wallet rules for an email guardian (spec section 9.3).
  - id: wallet-one-email-guardian
    statement: >-
      The wallet refuses a recovery configuration that lists more than one
      email guardian.
    status: tested
    evidence:
      test: "rule 1: accepts one email guardian and refuses a second"
      file: packages/passkey-sdk/src/perch/recoverySpec.test.ts

  - id: wallet-second-alert-channel
    statement: >-
      The wallet lists an email guardian in a recovery configuration only
      when a second alert channel is registered for the account. The vault
      probes each push device monthly with a notification that asks to be
      tapped; a tap posts the probe id signed by a device key the service
      worker made with the subscription. A device that acknowledged none of
      two probes is unacknowledged, and one the push service no longer
      accepts is lapsed; either way the address is told, and while no
      device is live the wallet refuses configurations that keep the email
      guardian. The wallet says notifications reach a device only on a
      device the vault lists as live or that acknowledged recently; on any
      other it says where they go and adds that device at once.
    status: tested
    evidence:
      - test: "rule 2: an email guardian needs a second alert channel"
        file: packages/passkey-sdk/src/perch/recoverySpec.test.ts
      - test: unacknowledged and lapsed devices break rule 2, as a lost subscription on this device does
        file: packages/frontend/src/lib/recovery/emailModel.test.ts
      - test: '"they reach this device" only on the device the vault lists as live, or that confirmed recently'
        file: packages/frontend/src/lib/recovery/emailModel.test.ts
      - test: a lapsed channel is shown, and a save that keeps the email helper is refused
        file: packages/frontend/src/lib/recovery/settingsEmail.test.ts
      - test: on a device without the subscription it says where notifications go, and adds this device at once
        file: packages/frontend/src/lib/recovery/settingsEmail.test.ts
      - test: probes each device monthly; a tap acknowledges it; two probes without one mark it unacknowledged and tell the address
        file: infra/email-alerts/test/liveness.test.ts
      - test: a gone subscription is marked lapsed, the address is told, and alerts go by email only
        file: infra/email-alerts/test/liveness.test.ts
      - test: a tap on the probe signs its id with the device key, posts it, and records when
        file: packages/frontend/src/lib/recovery/serviceWorker.test.ts
      - test: alerts-phone-switched
        file: research/email-recovery/eval/network/attacks.mjs

  - id: wallet-email-plus-delay
    statement: >-
      The wallet builds a configuration in which the email vote alone
      authorizes a recovery only under the lost-key profile with a delay of
      at least seven days of ledgers at the network's target ledger close
      time, which it reads from the network (120,960 ledgers at the 5-second
      target of testnet and mainnet, 151,200 at 4 seconds), and refuses to
      build one without that close time.
    status: tested
    evidence:
      - test: "rule 3: email alone needs the loss profile and a delay of at least 7 days of ledgers at the network close time"
        file: packages/passkey-sdk/src/perch/recoverySpec.test.ts
      - test: sizes the email-plus-delay floor to seven days
        file: packages/passkey-sdk/src/perch/ledgerTiming.test.ts

  - id: wallet-email-allowed-actions
    statement: >-
      When the quorum needs the email vote, the wallet refuses an email
      guardian that does not allow every recovery action.
    status: tested
    evidence:
      test: "rule 4: refuses narrower allowed actions when the quorum needs the email vote"
      file: packages/passkey-sdk/src/perch/recoverySpec.test.ts

  # The recovery circuit and its on-chain verification.
  - id: circuit-accepts-launch-providers
    statement: >-
      The recovery circuit accepts an honest recovery email from every launch
      domain in its provider's signing format, including an address of the
      maximum length, 124 bytes, with a 500-byte display name.
    status: tested
    evidence:
      test: "the circuit accepts the longest address with a long display name at %s"
      file: packages/email-recovery/test/recoveryInputs.test.ts

  - id: circuit-refuses-attacks
    statement: >-
      Every adversarial email of the provider mocks that a standard DKIM
      verifier accepts but whose claim must not be provable (display-name,
      comment, quoted and folded From spoofing; From values read as an
      address list, another mailbox or none; unsigned From or Subject
      fields; a misaligned or extra signature; an RSA-1024 key; an l= body;
      encoded, folded or split Subjects; replay into another statement or
      account) is refused by the recovery circuit, each at a named check.
    status: tested
    evidence:
      test: "valid-dkim-but-must-be-rejected-by-circuit"
      file: packages/email-recovery/test/attacks.test.ts

  - id: circuit-binds-public-inputs
    statement: >-
      Changing any public input of the recovery circuit (the commitment, a
      half of the statement digest, or the key-tree root), or any private
      value that links the email to them, makes the proof fail.
    status: tested
    evidence:
      - test: a_commitment_to_another_address_is_refused
        file: circuits/email-recovery/tests/src/recovery_tests.nr
      - test: a_commitment_to_a_case_variant_of_the_address_is_refused
        file: circuits/email-recovery/tests/src/recovery_tests.nr
      - test: a_commitment_under_another_account_code_is_refused
        file: circuits/email-recovery/tests/src/recovery_tests.nr
      - test: the_wrong_account_code_for_the_commitment_is_refused
        file: circuits/email-recovery/tests/src/recovery_tests.nr
      - test: another_digest_hi_is_refused
        file: circuits/email-recovery/tests/src/recovery_tests.nr
      - test: another_digest_lo_is_refused
        file: circuits/email-recovery/tests/src/recovery_tests.nr
      - test: swapped_digest_limbs_are_refused
        file: circuits/email-recovery/tests/src/recovery_tests.nr
      - test: another_rho_is_refused
        file: circuits/email-recovery/tests/src/recovery_tests.nr
      - test: a_root_without_the_key_is_refused
        file: circuits/email-recovery/tests/src/recovery_tests.nr
      - test: the_key_registered_under_another_domain_is_refused
        file: circuits/email-recovery/tests/src/recovery_tests.nr
      - test: a_tree_with_another_key_for_the_domain_is_refused
        file: circuits/email-recovery/tests/src/recovery_tests.nr
      - test: the_wrong_leaf_index_is_refused
        file: circuits/email-recovery/tests/src/recovery_tests.nr
      - test: a_leaf_index_of_16_or_more_bits_is_refused
        file: circuits/email-recovery/tests/src/recovery_tests.nr
      - test: the_leaf_as_key_root_is_refused
        file: circuits/email-recovery/tests/src/recovery_tests.nr

  - id: onchain-email-vote
    statement: >-
      A real proof of a launch provider's recovery email verifies on chain
      through Perch's UltraHonk verifier with the circuit's key, is refused
      with any public input changed, and counts as exactly one guardian vote.
    status: tested
    evidence:
      test: gmail_com_approval_counts_one_vote
      file: crates/integration-tests/tests/it/email_proofs.rs

  - id: onchain-verification-cost
    statement: >-
      One submit_guardian carrying an email approval with a real proof, for
      each of the 12 fixtures (every launch domain and a 124-byte address), uses
      121,799,565 to 121,883,583 instructions on the test host, 30.4 to 30.5% of the
      400 million a Soroban transaction may use, with the approval proven
      against a registry root; it reads 14 ledger entries and writes 2 (1,208
      bytes), with an invocation resource fee of 94,419 to 94,478
      stroops before rent; re-executed as a signed transaction it uses
      131,172,469 to 131,248,057 instructions in an 18,148-byte envelope, whose
      16,784-byte authorization entry holds the 16,224-byte proof, with a
      resource fee of 178,196 to 178,249 stroops before rent at the Soroban SDK's
      2026-07-10 snapshot of mainnet's fee schedule; mainnet's archived settings
      price the same transaction at 82,530 stroops before rent. Measured on the
      test host, not on a network.
    status: measured
    evidence:
      - file: research/email-recovery/eval/onchain.md
      - file: research/email-recovery/eval/README.md
      - file: circuits/email-recovery/MEASUREMENTS.md

  - id: desktop-proving-cost
    statement: >-
      On an 18-core desktop (Apple M5 Max) at a one-minute load average of
      about 6, proving one recovery email takes, as the median of five runs,
      0.94 seconds natively on every core and 4.64 seconds on one thread (1.69
      and 5.38 seconds with the witness, at 876 and 870 MiB peak), and 3.24
      seconds with bb.js in Node on 18 threads and 13.4 seconds on one (3.97 and
      14.1 seconds with the witness, at 1,662 and 1,386 MiB); a second run of
      the same build at a load average of 5.4 agrees within 2%; phone-class
      devices are not measured.
    status: measured
    evidence:
      - file: circuits/email-recovery/MEASUREMENTS.md
      - file: research/email-recovery/eval/results/proving.json

  # The evaluation on a network (research/email-recovery/eval/README.md).
  - id: network-attack-suite
    statement: >-
      On a local Stellar network, with Perch's controller and account and
      Nido's guardian, verifier and key registry deployed from their
      WebAssembly, the real circuit and real proofs, each of the 70 scenario
      rows of the evaluation has its expected outcome, and each refusal comes
      from a named layer: forged and replayed emails and proofs, a wrong
      account or new key in the statement, planted keys and expired pins, a
      compromised inbox, the alert path (an email vote below quorum, an email
      vote to cancel, a watcher outage, a lapsed push, a switched phone),
      phishing, repeated attempts and a vote among them, provider header
      variants, front-running, and the chain's view.
    status: tested
    evidence:
      - test: forged-emails-circuit
        file: research/email-recovery/eval/network/attacks.mjs
      - test: forged-wrong-key
        file: research/email-recovery/eval/network/attacks.mjs
      - test: replay-another-account
        file: research/email-recovery/eval/network/attacks.mjs
      - test: replay-another-controller
        file: research/email-recovery/eval/network/attacks.mjs
      - test: statement-other-new-key
        file: research/email-recovery/eval/network/attacks.mjs
      - test: registry-planted-key-in-timelock
        file: research/email-recovery/eval/network/attacks.mjs
      - test: registry-pin-expiry
        file: research/email-recovery/eval/network/attacks.mjs
      - test: quirks-each-provider
        file: research/email-recovery/eval/network/attacks.mjs
      - test: alerts-lapsed-push
        file: research/email-recovery/eval/network/attacks.mjs
      - test: social-phished-holds-passkey
        file: research/email-recovery/eval/network/attacks.mjs
      - test: social-phished-lost-devices
        file: research/email-recovery/eval/network/attacks.mjs
      - test: griefing-repeated-attempts
        file: research/email-recovery/eval/network/attacks.mjs
      - test: griefing-then-vote
        file: research/email-recovery/eval/network/attacks.mjs
      - test: alerts-phone-switched
        file: research/email-recovery/eval/network/attacks.mjs
      - test: inbox-email-cancel-alerted
        file: research/email-recovery/eval/network/attacks.mjs

  - id: registry-timelock-attacks
    statement: >-
      A key planted in the registry that has passed its timelock still cannot
      approve for an account whose account code the attacker lacks; revoking
      an active key refuses every root holding it in the same ledger; and a
      superseded root is refused one ledger after its grace period ends.
      Tested on the integration-test host with the registry's real timelocks,
      not on a network.
    status: tested
    evidence:
      - test: registry_planted_key_after_activation_without_account_code
        file: crates/integration-tests/tests/it/email_guardian.rs
      - test: registry_revoked_active_key
        file: crates/integration-tests/tests/it/email_guardian.rs
      - test: registry_grace_expiry
        file: crates/integration-tests/tests/it/email_guardian.rs

  - id: compromised-inbox-alerted
    statement: >-
      With the email guardian as the only guardian, under the lost-key
      profile and a seven-day delay, an attacker who holds the inbox and the
      account code can authorize a recovery attempt but cannot complete it
      within the delay; a cancellation by the owner's passkey within the
      delay succeeds; when the attacker deletes every email sent to the
      inbox, a Web Push alert is still accepted for the subscription of the
      device the owner set up for alerts; an email vote that leaves an
      attempt below quorum, and an email vote to cancel, are alerted on every
      channel, found in the vote's own transaction, also when 32 attempts
      were opened after the voted one, which the wallet's own read of live
      attempts still lists; and a watcher that missed the events alerts the
      authorized attempt from controller state after it restarts.
    status: tested
    evidence:
      - test: inbox-email-plus-delay
        file: research/email-recovery/eval/network/attacks.mjs
      - test: inbox-email-vote-alerted
        file: research/email-recovery/eval/network/attacks.mjs
      - test: inbox-email-cancel-alerted
        file: research/email-recovery/eval/network/attacks.mjs
      - test: griefing-then-vote
        file: research/email-recovery/eval/network/attacks.mjs
      - test: alerts-watcher-outage
        file: research/email-recovery/eval/network/attacks.mjs
      - test: "griefing-then-vote: forty attempts opened after the target do not hide the vote on it"
        file: infra/email-alerts/test/liveness.test.ts

  - id: front-running-one-vote
    statement: >-
      An email approval copied and submitted first by someone else records
      the guardian's single vote for the same attempt, and cannot be
      redirected to a cancellation, another attempt or another account.
    status: tested
    evidence:
      - test: front-running-copy-first
        file: research/email-recovery/eval/network/attacks.mjs
      - test: front-running-redirect
        file: research/email-recovery/eval/network/attacks.mjs

  - id: browser-proving-cost
    statement: >-
      In headless Chrome 151 on the same desktop, the wallet's own prover
      worker proves a recovery email in 1.44 seconds on 18 threads and 8.37
      seconds on one (median of five warm runs), 2.81 and 9.88 seconds from the
      page's request to the locally verified proof, with Barretenberg using 791
      and 757 MiB and the renderer peaking at 2,586 and 1,432 MiB; phone-class
      devices are not measured.
    status: measured
    evidence:
      - file: research/email-recovery/eval/results/proving.json
      - file: research/email-recovery/eval/browser-prover.md

  - id: network-verification-cost
    statement: >-
      On a local Stellar network at protocol 29 with mainnet's settings, the
      20 email votes with a real proof that leave their attempt collecting, each
      proven against its guardian's key pin, are metered at 121,576,077 to
      121,664,431 instructions (median 121,641,679) and declare 126,485,435 to
      126,577,531, which their fee is charged on; each reads 12 ledger entries
      and writes 2 (1,208 bytes) in an 18,080-byte transaction, and is charged
      83,125 to 83,153 stroops, 2,047 to 2,049 of them rent: the fee mainnet's
      settings give the same transaction. At mainnet's settings a ledger holds at
      most 12 such votes, 4 in each of its 3 clusters of 580,000,000
      instructions.
    status: measured
    evidence:
      - file: research/email-recovery/eval/results/attacks-local.json
      - file: research/email-recovery/eval/README.md
      - file: research/email-recovery/eval/results/settings/mainnet.json

  - id: testnet-email-recovery
    statement: >-
      On Stellar testnet, through Perch's deployment and Nido's factory and
      with the email-recovery contracts deployed from this repository, one
      complete email-factor recovery ran from enrollment to completion; its
      email vote, with a real proof against the guardian's key pin, was
      metered at 121,675,439 instructions
      (126,586,879 declared) in an 18,080-byte transaction charged 82,440
      stroops, 1,333 of them rent, 1,927 ms from simulation to confirmation; six
      pin votes of a second run of the same build were metered at 121,609,311
      to 121,696,841 instructions (126,516,681 to 126,607,608 declared) and
      charged 82,419 to 82,446 stroops. Both runs record their commit and each
      contract's wasm hash, read the deployed verifier's circuit id back, and
      keep every transaction's envelope, result and metadata XDR.
    status: measured
    evidence:
      - file: research/email-recovery/eval/results/testnet.json
      - file: research/email-recovery/eval/results/testnet-votes.json
      - file: research/email-recovery/eval/results/testnet-xdr.json

  - id: fee-attribution
    statement: >-
      A port of the host's fee computation reproduces, to the stroop, every
      fee charged in the evaluation's local-network and testnet runs from each
      transaction's declared resources and the network's archived settings.
      At mainnet's settings the Gmail email vote costs 37,969 stroops of
      compute, 36,419 of history, 3,585 of transaction size, 3,016 for its
      writes and 10 for events, 80,989 non-refundable, plus 2,049 rent and the
      100-stroop inclusion fee: 83,148, its charge on the local network;
      testnet charges the same components except rent, 1,333, because its
      minimum temporary lifetime is 720 ledgers against mainnet's 17,280.
    status: measured
    evidence:
      - file: research/email-recovery/eval/README.md
      - file: docs/email-recovery/spec.md

  - id: metering-attribution
    statement: >-
      Re-executed on the test host, the Gmail vote's transaction meters
      130,031,418 instructions under mainnet's cost model and 130,065,594
      under testnet's, which differs in nine CPU cost types; between the
      networks the medians of the same wasm differ by 23,436 instructions
      (0.02%); and the release-profile build of the contracts meters 1,574,340
      fewer instructions per vote than the size-optimized wasm every network
      here runs.
    status: measured
    evidence:
      file: research/email-recovery/eval/README.md

  # Supporting results of the Lean model.
  - id: guardian-payload-irrelevant
    statement: >-
      The guardian's verdict does not depend on the authorization entry an
      approval is wrapped in, so whoever submits a copy of an approval gets
      the verdict the original would have had.
    status: proven
    evidence:
      lean: EmailRecovery.check_payload_irrelevant
      file: research/email-recovery/formal/EmailRecovery/Guardian.lean

  - id: digest-fixes-statement
    statement: >-
      A statement digest fixes one account, network, controller, action,
      attempt or request id and epoch, unless the two statements' encodings
      are a SHA-256 collision.
    status: proven
    evidence:
      lean: EmailRecovery.digest_fixes
      file: research/email-recovery/formal/EmailRecovery/Replay.lean

  - id: completion-waits-for-delay
    statement: >-
      In every trace of the controller model, every completed recovery is
      preceded by its attempt's authorization under a configuration with a
      positive delay, at least that many ledgers earlier.
    status: proven
    evidence:
      lean: EmailRecovery.Perch.completion_waits_for_delay
      file: research/email-recovery/formal/EmailRecovery/OneFactor.lean

  - id: owner-can-cancel
    statement: >-
      During the delay, a cancellation of a live attempt by the owner of a
      lost-key-profile account succeeds.
    status: proven
    evidence:
      lean: EmailRecovery.Perch.owner_can_cancel
      file: research/email-recovery/formal/EmailRecovery/OneFactor.lean

  - id: check-iff-accepted
    statement: >-
      The model's guardian check returns success exactly when the facts of
      its twelve checks hold, one per check.
    status: proven
    evidence:
      lean: EmailRecovery.check_eq_ok_iff
      file: research/email-recovery/formal/EmailRecovery/Guardian.lean

  - id: email-only-never-authorizes
    statement: >-
      Under a configuration with a quorum of at least two, or in combined or
      zk-only mode, approvals by the email guardian alone authorize no
      attempt.
    status: proven
    evidence:
      lean: EmailRecovery.Perch.email_only_never_authorizes
      file: research/email-recovery/formal/EmailRecovery/OneFactor.lean

  - id: email-alone-change-condition
    statement: >-
      The email guardian's approval alone meets the recovery condition for a
      Protected reconfiguration or upgrade only in guardian-only mode with
      quorum one.
    status: proven
    evidence:
      lean: EmailRecovery.Perch.quorum_one_of_conditionMet
      file: research/email-recovery/formal/EmailRecovery/OneFactor.lean

  - id: lean-axioms
    statement: >-
      The build pins every theorem's axiom dependencies: none depends on
      anything beyond Lean's built-in propext, Quot.sound and
      Classical.choice, and no proof is left open.
    status: tested
    evidence:
      test: guard_msgs
      file: research/email-recovery/formal/EmailRecovery/Axioms.lean

  # The circuit, the guardian and the registry, by component.
  - id: circuit-size
    statement: >-
      The recovery circuit has 248,996 UltraHonk gates (109,809 ACIR
      opcodes), padded to 2^18; the same relation at a 1024-byte header bound
      has 188,986 gates, also padded to 2^18; every proof is 16,224 bytes.
    status: measured
    evidence:
      file: circuits/email-recovery/MEASUREMENTS.md

  - id: header-bound-fits
    statement: >-
      With a 1536-byte header bound, the recovery email of every launch domain
      in its provider mock's format fits, and with a 124-byte address it still
      fits a display name of 536 bytes at the tightest provider (WEB.DE) and
      965 bytes at the loosest (Yahoo).
    status: measured
    evidence:
      file: circuits/email-recovery/README.md

  - id: circuit-vendoring
    statement: >-
      The circuit compiles only vendored noir-bignum and sha256 libraries and
