  # The assumptions the properties rest on.
  - id: dkim-unforgeability
    statement: >-
      (A1a) Without a provider's private DKIM key, nobody can produce a valid
      rsa-sha256 signature under that key.
    status: assumed
    evidence:
      assumption: >-
        RSASSA-PKCS1-v1_5 with SHA-256 is existentially unforgeable under
        chosen-message attack for 2048-bit moduli, and each provider keeps
        its signing keys secret.

  - id: provider-authenticates-sender
    statement: >-
      (A1b) A launch provider DKIM-signs a message whose From address is one
      of its mailboxes only when the holder of that mailbox submitted it: it
      refuses or rewrites a submission with two From fields, or
      authenticates the instance it signs, and for a From with a display name
      authenticates the address the circuit binds (a From naming several
      addresses the circuit refuses); sending as
      another address of its domain needs proof of control of that mailbox;
      and an address it assigns again cannot be used against an existing
      enrollment.
    status: assumed
    evidence:
      assumption: >-
        Each allowlisted provider authenticates the submitting user and
        refuses to sign a From address in its domain that the user does not
        control. Reviewed per provider from public documentation and
        measurements in research/email-recovery/eval/parser/sender-authentication.md:
        how each submission path handles two From fields or several
        addresses is unknown today for every provider, and was not met by
        Yahoo, iCloud and Fastmail in 2020, though the circuit refuses a From
        naming several addresses (spec 4.5); Fastmail and GMX/WEB.DE assign
        deleted or inactive addresses again, which the account code covers.

  - id: registry-correctness
    statement: >-
      Every key the DKIM key registry lists as active for a domain was
      published by that domain's provider.
    status: assumed
    evidence:
      assumption: >-
        Fewer than the registry multisig's threshold of signers are
        malicious, and a key added without the provider's publication is
        noticed and vetoed before its timelock ends.

  - id: ledger-timing
    statement: >-
      The registry's timelocks, grace and proposal lifetime, the key pin, the
      enclave-image registry's timelock and the vault's contact-change delay
      are measured on ledger close time and last their wall-clock length
      whatever the network's target ledger close time; Perch's recovery
      delay and statement expiry stay ledger counts, and the email-plus-delay
      floor, sized by the wallet from the target close time when it builds a
      configuration, lasts seven days of wall-clock time only while ledgers
      close no faster than that target.
    status: assumed
    evidence:
      assumption: >-
        Validators keep an honest clock, so a ledger's close time, which
        stellar-core accepts only if it is later than the previous one and at
        most 60 seconds past the validating node's clock, tracks wall-clock
        time; and ledgers close on average no faster than the network's
        target close time (scp_timing.ledger_target_close_time_milliseconds,
        CAP-0070), which validators can lower by vote, shortening in
        proportion the delay of a configuration built at the old target
        until it is rebuilt.

  - id: proof-system-security
    statement: >-
      UltraHonk proofs in the zero-knowledge flavor that Perch's verifier
      accepts are knowledge-sound and reveal nothing beyond the public
      inputs.
    status: assumed
    evidence:
      assumption: >-
        Knowledge soundness and zero knowledge of UltraHonk in the random
        oracle model, with Keccak as the transcript hash, as implemented by
        Perch's pinned Barretenberg and its Soroban verifier: an efficient
        extractor exists for which an efficient prover gets a proof accepted
        that the extractor fails on only with negligible probability, and an
        honest proof of a valid witness is indistinguishable from a
        simulator's output on its public inputs.

  - id: commitment-hiding
    statement: >-
      The commitment Poseidon2(address, account code) and the salted pin root
      hide the address and the pinned keys from anyone who does not hold the
      account code.
    status: assumed
    evidence:
      assumption: >-
        Poseidon2 behaves as a random oracle on its inputs, and the account
        code carries at least 128 bits of entropy that only the user holds, so
        the commitment and the pin root are indistinguishable from two handles
        drawn independently of the address and the keys.

  - id: hash-collision-resistance
    statement: >-
      Nobody can find a SHA-256 collision, a Poseidon2 collision, or a
      Poseidon2 input that hashes to zero.
    status: assumed
    evidence:
      assumption: >-
        SHA-256 and Poseidon2 (noir-lang/poseidon v0.2.0 over the BN254 scalar
        field) are collision resistant, and Poseidon2 behaves as a random
        function, so no input is known that it maps to zero, the empty leaf of
        the key trees. The theorems reduce to this assumption by naming the
        colliding inputs, computed from their own data.

  - id: honest-enrollment
    statement: >-
      The wallet that enrolls the account commits to the exact From address of
      the DKIM-signed enrollment email with a fresh account code, and pins only
      keys it has checked.
    status: assumed
    evidence:
      assumption: >-
        The enrolling wallet is honest at enrollment: it computes the
        commitment and the pin root from the real enrollment email and the
        keys it verified.

  - id: secret-generation
    statement: >-
      The account code and every blinding value rho come from a
      cryptographically secure generator and stay with the user and the
      user's browser.
    status: assumed
    evidence:
      assumption: >-
        The wallet's random generator is secure, and the user's device and
        browser are not compromised while they hold the account code or rho.

  - id: blinded-subject-hiding
    statement: >-
      The Subject value T reveals nothing about the statement digest to anyone
      who does not know rho, so the email's content does not link it to an
      attempt on chain; its timing, next to the on-chain vote that follows it,
      can.
    status: assumed
    evidence:
      assumption: >-
        Poseidon2 behaves as a random function, and rho is a fresh 248-bit
        value that never leaves the browser that builds the proof.

  - id: enclave-isolation
    statement: >-
      The attested enclave that holds alert addresses keeps its memory from
      its host and operators, and at most one of its three key custodians is
      malicious.
    status: assumed
    evidence:
      assumption: >-
        The enclave platform's isolation and attestation hold, and no two of
        the three independent custodians collude or are compromised together.

  - id: recovery-domain-routing
    statement: >-
      (A10) Mail to the recovery address reaches only the enclave: the
      recovery domain's MX records, its MTA-STS policy and the TLS keys of
      its mail exchanger are the enclave's, and the operator does not change
      them.
    status: assumed
    evidence:
      assumption: >-
        Sending providers follow the recovery domain's MX and MTA-STS policy
        and check no enclave attestation, so an operator that repoints the MX
        or relaxes the policy, with a certificate for the host it points to,
        receives later enrollment and recovery emails outside the enclave.
        Nothing built detects such a change; the production mail exchanger
        inside the enclave and the domain's MTA-STS policy are not built.

  - id: published-wallet-build
    statement: >-
      (A11) The user's browser runs the wallet build the operator publishes,
      which reads the From address only in the browser and sends it only
      sealed to the attested vault.
    status: assumed
    evidence:
      assumption: >-
        A browser runs whatever code the wallet's origin serves; a modified
        build served to a user could read the address at enrollment or at
        recovery. Nothing built lets the user check the served code against
        a published build.

  - id: alert-liveness
    statement: >-
      (A12) Under the email-plus-delay profile, the owner learns of an
      authorized attempt within the delay: the alert service reaches a
      device the owner set up for alerts and still uses, or an alert address
      the inbox thief does not hold, or the owner opens the wallet.
    status: assumed
    evidence:
      assumption: >-
        The alert service runs, or restarts and reconciles from the
        controller's state, within the delay; a device the owner still uses
        holds a push subscription. The monthly probe finds a revoked
        subscription and, from the missing tap, a device that stopped
        acknowledging, the latter 60 to 90 days after it stopped; the owner
        acts on either notice, and reads what reaches them. One-factor safety itself does not rest on
        this: it bounds when a recovery can complete, not whether the owner
        cancels.

  - id: user-behaviour
    statement: >-
      Users keep the recovery code, notice an alert and cancel a wrongful
      attempt within the delay, and refuse a caller who asks them to send a
      recovery email or read out the code.
    status: unproven

  - id: expert-walkthrough
    statement: >-
      A cognitive walkthrough of the current enrollment, recovery and
      settings pages, done by their designers rather than by participants or
      an independent expert, leaves ten issues open, among them that a
      phished user sees no Nido warning before sending the email, that the
      monthly probe finds a device that stopped acknowledging only 60 to 90
      days later, that the inbox may sync the passkey it should back up, and
      that phones are not measured.
    status: unproven

  - id: toolchain-correctness
    statement: >-
      The pinned compiler and prover compile and prove the circuit as written,
      beyond the public advisories reviewed for them.
    status: assumed
    evidence:
      assumption: >-
        nargo 1.0.0-beta.9 and Barretenberg 0.87.0, and the vendored
        noir-bignum and sha256 libraries, are sound for the constructs the
        circuit uses.
