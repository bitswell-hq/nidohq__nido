# Claim ledger for the email-recovery paper and slides.
#
# One entry per claim the documents make. \claim{id} renders the status tag
# and \claimstatement{id} the statement, so both documents word a claim the
# same way. check-claims.pl enforces the format; README.md describes it.
#
# status: proven | tested | measured | assumed | unproven
# evidence, by status (paths relative to the repository root):
#   proven    { lean: <theorem name>, file: <.lean path> }
#   tested    { test: <test name>,    file: <test file path> }
#   measured  { file: <measurement file path> }
#   assumed   { assumption: <the stated assumption> }
#   unproven  (none)

claims:
  # The four properties of the email factor, proven in Lean
  # (research/email-recovery/formal/README.md).
  - id: email-factor-soundness
    statement: >-
      If the email guardian accepts an approval and the proof system is
      knowledge sound, there is an email whose signed header carries a valid RSA-2048 DKIM signature under a key whose leaf for
      the From domain is in the tree of the unexpired pin or of a root the
      registry accepts; whose From address, with the account code, opens the
      account's commitment; and whose Subject opens to the digest of a recovery
      statement naming this account, controller and network, an allowed action
      and an unexpired bound. With an honest registry and enrollment, the From
      address is the enrolled one and the key is a listed key, unless Poseidon2
      collides or maps an input to zero.
    status: proven
    evidence:
      lean: EmailRecovery.soundness
      file: research/email-recovery/formal/EmailRecovery/Soundness.lean

  - id: address-privacy
    statement: >-
      Everything the chain holds or computes about an email guardian (its
      configuration, its verdict on every approval, and the controller's state
      and events over every run) depends on the enrolled address only through
      the salted commitment and the salted pin root.
    status: proven
    evidence:
      lean: EmailRecovery.privacy_noninterference
      file: research/email-recovery/formal/EmailRecovery/Privacy.lean

  - id: replay-resistance
    statement: >-
      An approval is accepted only in a context naming its own statement
      digest, which fixes one account, network, controller, action, attempt or
      request id and epoch unless SHA-256 collides; the controller counts the
      email guardian at most once per attempt and domain or per change digest,
      so a copy submitted by anyone records the same single vote.
    status: proven
    evidence:
      lean: EmailRecovery.Perch.email_vote_replay
      file: research/email-recovery/formal/EmailRecovery/Replay.lean

  - id: one-factor-safety
    statement: >-
      With approvals by the email guardian as the only evidence, an attempt is
      authorized only under a guardian-only configuration with quorum one, and
      a recovery completes only after a positive delay has passed since its
      authorization.
    status: proven
    evidence:
      lean: EmailRecovery.Perch.one_factor_safety
      file: research/email-recovery/formal/EmailRecovery/OneFactor.lean

  - id: wallet-policy-one-factor
    statement: >-
      Under the wallet policy, the email guardian alone reaches the quorum only
      under the loss profile, with a delay of at least seven days (120,960
      ledgers) and a second alert channel.
    status: proven
    evidence:
      lean: EmailRecovery.Perch.one_factor_under_wallet_policy
      file: research/email-recovery/formal/EmailRecovery/WalletPolicy.lean

  - id: model-code-agreement
    statement: >-
      The Lean model's statement encoding matches the code: Perch's encoder
      reproduces independent vectors, and the guardian's parser reads every
      statement shape that encoder produces.
    status: tested
    evidence:
      test: statement_parser_reads_perch_encodings
      file: contracts/email-guardian/src/test.rs

  # Nido's wallet rules for an email guardian (spec section 9.3).
  - id: wallet-one-email-guardian
    statement: >-
      The wallet refuses a recovery configuration that lists more than one
      email guardian.
    status: tested
    evidence:
      test: "rule 1: accepts one email guardian and refuses a second"
      file: packages/passkey-sdk/src/perch/recoverySpec.test.ts

  - id: wallet-second-alert-channel
    statement: >-
      The wallet lists an email guardian in a recovery configuration only
      when a second alert channel is registered for the account.
    status: tested
    evidence:
      test: "rule 2: an email guardian needs a second alert channel"
      file: packages/passkey-sdk/src/perch/recoverySpec.test.ts

  - id: wallet-email-plus-delay
    statement: >-
      The wallet builds a configuration in which the email vote alone
      authorizes a recovery only under the lost-key profile with a delay of
      at least seven days (120,960 ledgers).
    status: tested
    evidence:
      test: "rule 3: email alone needs the loss profile and a delay of at least 120960 ledgers"
      file: packages/passkey-sdk/src/perch/recoverySpec.test.ts

  - id: wallet-email-allowed-actions
    statement: >-
      When the quorum needs the email vote, the wallet refuses an email
      guardian that does not allow every recovery action.
    status: tested
    evidence:
      test: "rule 4: refuses narrower allowed actions when the quorum needs the email vote"
      file: packages/passkey-sdk/src/perch/recoverySpec.test.ts

  # The recovery circuit and its on-chain verification.
  - id: circuit-accepts-launch-providers
    statement: >-
      The recovery circuit accepts an honest recovery email from every launch
      domain in its provider's signing format, including an address of the
      maximum length, 124 bytes, with a 500-byte display name.
    status: tested
    evidence:
      test: "the circuit accepts the longest address with a long display name at %s"
      file: packages/email-recovery/test/recoveryInputs.test.ts

  - id: circuit-refuses-attacks
    statement: >-
      Every adversarial email of the provider mocks that a standard DKIM
      verifier accepts but whose claim must not be provable (display-name,
      comment, quoted and folded From spoofing; unsigned From or Subject
      fields; a misaligned or extra signature; an RSA-1024 key; an l= body;
      encoded, folded or split Subjects; replay into another statement or
      account) is refused by the recovery circuit, each at a named check.
    status: tested
    evidence:
      test: "valid-dkim-but-must-be-rejected-by-circuit"
      file: packages/email-recovery/test/attacks.test.ts

  - id: circuit-binds-public-inputs
    statement: >-
      Changing any public input of the recovery circuit (the commitment, a
      half of the statement digest, or the key-tree root), or any private
      value that links the email to them, makes the proof fail.
    status: tested
    evidence:
      test: a_commitment_under_another_account_code_is_refused
      file: circuits/email-recovery/tests/src/recovery_tests.nr

  - id: onchain-email-vote
    statement: >-
      A real proof of a launch provider's recovery email verifies on chain
      through Perch's UltraHonk verifier with the circuit's key, is refused
      with any public input changed, and counts as exactly one guardian vote.
    status: tested
    evidence:
      test: gmail_com_approval_counts_one_vote
      file: crates/integration-tests/tests/it/email_proofs.rs

  - id: onchain-verification-cost
    statement: >-
      One submit_guardian carrying an email approval with a real proof uses
      about 122 million of the 400 million instructions a Soroban transaction
      may use, reads 14 ledger entries and writes 2 (1,208 bytes); as a
      signed transaction it is 18,148 bytes with a resource fee of about
      178,000 stroops before rent, at the mainnet fee rates the Soroban SDK
      records. Measured on the test host, not on a network.
    status: measured
    evidence:
      file: research/email-recovery/eval/onchain.md

  - id: desktop-proving-cost
    statement: >-
      On a shared 18-core desktop, the recovery circuit proves in under one
      second with the native prover, and in about 14 seconds on one thread
      and 3.3 seconds on 18 threads with bb.js in Node, using at most about
      1.7 GiB; phone-class devices are not measured.
    status: measured
    evidence:
      file: circuits/email-recovery/MEASUREMENTS.md

  # The assumptions the properties rest on.
  - id: dkim-unforgeability
    statement: >-
      Without a provider's private DKIM key, nobody can produce a valid
      rsa-sha256 signature under that key.
    status: assumed
    evidence:
      assumption: >-
        RSASSA-PKCS1-v1_5 with SHA-256 is existentially unforgeable under
        chosen-message attack for 2048-bit moduli, and each provider keeps
        its signing keys secret.

  - id: provider-authenticates-sender
    statement: >-
      A launch provider DKIM-signs a message whose From address is one of
      its mailboxes only when the holder of that mailbox submitted it.
    status: assumed
    evidence:
      assumption: >-
        Each allowlisted provider authenticates the submitting user and
        refuses to sign a From address in its domain that the user does not
        control.

  - id: registry-correctness
    statement: >-
      Every key the DKIM key registry lists as active for a domain was
      published by that domain's provider.
    status: assumed
    evidence:
      assumption: >-
        Fewer than the registry multisig's threshold of signers are
        malicious, and a key added without the provider's publication is
        noticed and vetoed before its timelock ends.

  - id: proof-system-security
    statement: >-
      UltraHonk proofs in the zero-knowledge flavor that Perch's verifier
      accepts are knowledge-sound and reveal nothing beyond the public
      inputs.
    status: assumed
    evidence:
      assumption: >-
        Knowledge soundness and zero knowledge of UltraHonk in the random
        oracle model, with Keccak as the transcript hash, as implemented by
        Perch's pinned Barretenberg and its Soroban verifier.

  - id: commitment-hiding
    statement: >-
      The commitment Poseidon2(address, account code) hides the address
      from anyone who does not hold the account code.
    status: assumed
    evidence:
      assumption: >-
        Poseidon2 behaves as a random oracle on its inputs, and the account
        code carries at least 128 bits of entropy that only the user holds.

  - id: hash-collision-resistance
    statement: >-
      Nobody can find a SHA-256 collision, a Poseidon2 collision, or a
      Poseidon2 input that hashes to zero.
    status: assumed
    evidence:
      assumption: >-
        SHA-256 and Poseidon2 (noir-lang/poseidon v0.2.0 over the BN254 scalar
        field) are collision resistant, and Poseidon2 behaves as a random
        function, so no input is known that it maps to zero, the empty leaf of
        the key trees.

  - id: honest-enrollment
    statement: >-
      The wallet that enrolls the account commits to the exact From address of
      the DKIM-signed enrollment email with a fresh account code, and pins only
      keys it has checked.
    status: assumed
    evidence:
      assumption: >-
        The enrolling wallet is honest at enrollment: it computes the
        commitment and the pin root from the real enrollment email and the
        keys it verified.
