  - id: registry-timelocks
    statement: >-
      A registry addition attested live in DNS activates exactly 72 hours of
      ledger close time after the later of its approval and its attestation,
      and any other addition exactly 7 days after approval; a superseded root
      stays accepted through its grace period; these windows are measured in
      seconds and do not shorten when more ledgers close in them; the empty
      tree and unknown roots are never accepted. On the integration-test host
      a proof against a pending addition's root is refused one second before
      the 72 hours end and counted once the addition executes.
    status: tested
    evidence:
