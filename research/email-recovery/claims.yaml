      the recovery address reaches only the enclave (A10), and the user runs
      the published wallet build (A11). The user's mail provider and the
      alert-sending service necessarily see the address.
    status: assumed
    evidence:
      assumption: >-
        A8, A10 and A11 hold together. The claim is not that the address can
        never be leaked, and it is not a tested property of a deployment: the
        tests cover the alert path with every third party mocked
        (servers-cannot-read-address).

  - id: alert-formats
    statement: >-
      The wallet's HPKE reproduces RFC 9180's test vector A.3.1, the alert
      path's Web Push encryption reproduces RFC 8291's example byte for byte,
      and alert email fails over from the first EU sending service to the second
      after two failures, reusing one idempotency key.
    status: tested
    evidence:
      - test: reproduces the RFC 8291 example byte for byte
        file: infra/email-alerts/test/crypto.test.ts
      - test: reproduces RFC 9180 A.3.1 (keys, enc, first ciphertext)
        file: packages/email-recovery/test/hpke.test.ts
      - test: fails over from Lettermint to Scaleway after two failures, reusing one Idempotency-Key
        file: infra/email-alerts/test/alerts.test.ts

  - id: end-to-end-local
    statement: >-
      On a local network, in Chromium, the wallet enrolls an inbox, deploys
      and lists its guardian, and after the passkey is lost recovers the
      account with one recovery email proven in the browser and a second
      helper's vote, with the alert email and push carrying the code the page
      shows.
    status: tested
    evidence:
      test: enroll an inbox, lose the passkey, recover with one email and a second helper
      file: tests/e2e/local/email-recovery.local.spec.ts

  - id: provider-mock-formats
    statement: >-
      Each launch provider's mock signs with test-only keys in that
      provider's layout, established from public mailing-list archives: the
      28 DKIM-Signature fields observed there are reproduced line break for
      line break.
    status: tested
    evidence:
