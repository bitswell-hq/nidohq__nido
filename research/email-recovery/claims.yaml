      - test: prints first on an iPhone, and says a download goes to iCloud Drive
        file: packages/frontend/src/lib/recovery/emailBackup.test.ts
      - test: the kit names its Nido and where recovery starts
        file: packages/frontend/src/lib/recovery/emailModel.test.ts
      - test: enrollment warns, without blocking, when alerts would go to the enrolled inbox
        file: packages/frontend/src/lib/recovery/emailModel.test.ts
      - test: enrollment notes when the inbox is at the platform that likely syncs this passkey
        file: packages/frontend/src/lib/recovery/emailModel.test.ts
      - test: the privacy copy around the claim says what the provider, a chain watcher and the sending services see
        file: packages/frontend/src/lib/recovery/emailModel.test.ts
      - test: matches only the code whose salted leaf, with a known key, rebuilds the pin root
        file: packages/frontend/src/lib/recovery/emailModel.test.ts

  - id: recovery-page-aids
    statement: >-
      Opened at the wallet's apex, the recovery page finds the account from
