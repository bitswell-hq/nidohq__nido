# Claim ledger for the email-recovery paper and slides.
#
# One entry per claim the documents make. \claim{id} renders the status tag
# and \claimstatement{id} the statement, so both documents word a claim the
# same way. check-claims.pl enforces the format; README.md describes it.
#
# status: proven | tested | measured | assumed | unproven
# evidence, by status (paths relative to the repository root):
#   proven    { lean: <theorem name>, file: <.lean path> }
#   tested    { test: <test name>,    file: <test file path> }
#   measured  { file: <measurement file path> }
#   assumed   { assumption: <the stated assumption> }
#   unproven  (none)

claims:
  # The four properties of the email factor, proven in Lean
  # (research/email-recovery/formal/README.md).
  - id: email-factor-soundness
    statement: >-
      If the email guardian accepts an approval and the proof system is
      knowledge sound, there is an email whose signed header carries a valid RSA-2048 DKIM signature under a key whose leaf for
      the From domain is in the tree of the unexpired pin or of a root the
      registry accepts; whose From address, with the account code, opens the
      account's commitment; and whose Subject opens to the digest of a recovery
      statement naming this account, controller and network, an allowed action
      and an unexpired bound. With an honest registry and enrollment, the From
      address is the enrolled one and the key is a listed key, unless Poseidon2
      collides or maps an input to zero.
    status: proven
    evidence:
      lean: EmailRecovery.soundness
      file: research/email-recovery/formal/EmailRecovery/Soundness.lean

  - id: address-privacy
    statement: >-
      Everything the chain holds or computes about an email guardian (its
      configuration, its verdict on every approval, and the controller's state
      and events over every run) depends on the enrolled address only through
      the salted commitment and the salted pin root.
    status: proven
    evidence:
      lean: EmailRecovery.privacy_noninterference
      file: research/email-recovery/formal/EmailRecovery/Privacy.lean

  - id: replay-resistance
    statement: >-
      An approval is accepted only in a context naming its own statement
      digest, which fixes one account, network, controller, action, attempt or
      request id and epoch unless SHA-256 collides; the controller counts the
      email guardian at most once per attempt and domain or per change digest,
      so a copy submitted by anyone records the same single vote.
    status: proven
    evidence:
      lean: EmailRecovery.Perch.email_vote_replay
      file: research/email-recovery/formal/EmailRecovery/Replay.lean

  - id: one-factor-safety
    statement: >-
      With approvals by the email guardian as the only evidence, an attempt is
      authorized only under a guardian-only configuration with quorum one, and
      a recovery completes only after a positive delay has passed since its
      authorization.
    status: proven
    evidence:
      lean: EmailRecovery.Perch.one_factor_safety
      file: research/email-recovery/formal/EmailRecovery/OneFactor.lean

  - id: wallet-policy-one-factor
    statement: >-
      Under the wallet policy, the email guardian alone reaches the quorum only
      under the loss profile, with a delay of at least seven days (120,960
      ledgers) and a second alert channel.
    status: proven
    evidence:
      lean: EmailRecovery.Perch.one_factor_under_wallet_policy
      file: research/email-recovery/formal/EmailRecovery/WalletPolicy.lean

  - id: model-code-agreement
    statement: >-
      The Lean model's statement encoding matches the code: Perch's encoder
      reproduces independent vectors, and the guardian's parser reads every
      statement shape that encoder produces.
    status: tested
    evidence:
      test: statement_parser_reads_perch_encodings
      file: contracts/email-guardian/src/test.rs

  # Nido's wallet rules for an email guardian (spec section 9.3).
  - id: wallet-one-email-guardian
    statement: >-
      The wallet refuses a recovery configuration that lists more than one
      email guardian.
    status: tested
    evidence:
      test: "rule 1: accepts one email guardian and refuses a second"
      file: packages/passkey-sdk/src/perch/recoverySpec.test.ts

  - id: wallet-second-alert-channel
    statement: >-
      The wallet lists an email guardian in a recovery configuration only
      when a second alert channel is registered for the account; the vault
      probes that channel weekly and marks it lapsed when the push service
      no longer accepts it, and the wallet then refuses configurations that
      keep the email guardian until notifications are moved to a device
      again.
    status: tested
    evidence:
      - test: "rule 2: an email guardian needs a second alert channel"
        file: packages/passkey-sdk/src/perch/recoverySpec.test.ts
      - test: lapses on the vault word or on this device subscription; is live only on the vault word
        file: packages/frontend/src/lib/recovery/emailModel.test.ts
      - test: a lapsed channel is shown, and a save that keeps the email helper is refused
        file: packages/frontend/src/lib/recovery/settingsEmail.test.ts
      - test: probes a subscription weekly; a gone one is marked lapsed, the address is told, and alerts go by email only
        file: infra/email-alerts/test/liveness.test.ts
      - test: status reads the channels; push moves notifications at once only from a gone subscription, and tells the address
        file: infra/email-alerts/test/liveness.test.ts

  - id: wallet-email-plus-delay
    statement: >-
      The wallet builds a configuration in which the email vote alone
      authorizes a recovery only under the lost-key profile with a delay of
      at least seven days (120,960 ledgers).
    status: tested
    evidence:
      test: "rule 3: email alone needs the loss profile and a delay of at least 120960 ledgers"
      file: packages/passkey-sdk/src/perch/recoverySpec.test.ts

  - id: wallet-email-allowed-actions
    statement: >-
      When the quorum needs the email vote, the wallet refuses an email
      guardian that does not allow every recovery action.
    status: tested
    evidence:
      test: "rule 4: refuses narrower allowed actions when the quorum needs the email vote"
      file: packages/passkey-sdk/src/perch/recoverySpec.test.ts

  # The recovery circuit and its on-chain verification.
  - id: circuit-accepts-launch-providers
    statement: >-
      The recovery circuit accepts an honest recovery email from every launch
      domain in its provider's signing format, including an address of the
      maximum length, 124 bytes, with a 500-byte display name.
    status: tested
    evidence:
      test: "the circuit accepts the longest address with a long display name at %s"
      file: packages/email-recovery/test/recoveryInputs.test.ts

  - id: circuit-refuses-attacks
    statement: >-
      Every adversarial email of the provider mocks that a standard DKIM
      verifier accepts but whose claim must not be provable (display-name,
      comment, quoted and folded From spoofing; unsigned From or Subject
      fields; a misaligned or extra signature; an RSA-1024 key; an l= body;
      encoded, folded or split Subjects; replay into another statement or
      account) is refused by the recovery circuit, each at a named check.
    status: tested
    evidence:
      test: "valid-dkim-but-must-be-rejected-by-circuit"
      file: packages/email-recovery/test/attacks.test.ts

  - id: circuit-binds-public-inputs
    statement: >-
      Changing any public input of the recovery circuit (the commitment, a
      half of the statement digest, or the key-tree root), or any private
      value that links the email to them, makes the proof fail.
    status: tested
    evidence:
      test: a_commitment_under_another_account_code_is_refused
      file: circuits/email-recovery/tests/src/recovery_tests.nr

  - id: onchain-email-vote
    statement: >-
      A real proof of a launch provider's recovery email verifies on chain
      through Perch's UltraHonk verifier with the circuit's key, is refused
      with any public input changed, and counts as exactly one guardian vote.
    status: tested
    evidence:
      test: gmail_com_approval_counts_one_vote
      file: crates/integration-tests/tests/it/email_proofs.rs

  - id: onchain-verification-cost
    statement: >-
      One submit_guardian carrying an email approval with a real proof, for
      each of the 12 fixtures (every launch domain and a 124-byte address), uses
      121,801,947 to 121,916,929 instructions on the test host, 30.5% of the
      400 million a Soroban transaction may use, with the approval proven
      against a registry root; it reads 14 ledger entries and writes 2 (1,208
      bytes), with an invocation resource fee of 94,421 to 94,501
      stroops before rent; re-executed as a signed transaction it uses
      131,142,707 to 131,256,349 instructions in an 18,148-byte envelope, whose
      16,784-byte authorization entry holds the 16,224-byte proof, with a
      resource fee of 178,175 to 178,255 stroops before rent, at the mainnet fee
      rates the Soroban SDK records. Measured on the test host, not on a
      network.
    status: measured
    evidence:
      - file: research/email-recovery/eval/onchain.md
      - file: research/email-recovery/eval/README.md

  - id: desktop-proving-cost
    statement: >-
      On an 18-core desktop (Apple M5 Max) shared with other work, proving one
      recovery email takes, as the median of five runs, 0.94 seconds natively on
      every core and 4.67 seconds on one thread (1.58 and 5.31 seconds with the
      witness, at 879 and 872 MiB peak), and 3.30 seconds with bb.js in Node on 18
      threads and 13.5 seconds on one (4.06 and 14.3 seconds with the witness, at
      1,716 and 1,421 MiB); phone-class devices are not measured.
    status: measured
    evidence:
      - file: circuits/email-recovery/MEASUREMENTS.md
      - file: research/email-recovery/eval/results/proving.json

  # The evaluation on a network (research/email-recovery/eval/README.md).
  - id: network-attack-suite
    statement: >-
      On a local Stellar network, with Perch's controller and account and
      Nido's guardian, verifier and key registry deployed from their
      WebAssembly, the real circuit and real proofs, each of the 65 scenario
      rows of the evaluation has its expected outcome, and each refusal comes
      from a named layer: forged and replayed emails and proofs, a wrong
      account or new key in the statement, planted keys and expired pins, a
      compromised inbox, the alert path (an email vote below quorum, a
      watcher outage, a lapsed push), phishing, repeated attempts, provider
      header variants, front-running, and the chain's view.
    status: tested
    evidence:
      - test: forged-emails-circuit
        file: research/email-recovery/eval/network/attacks.mjs
      - test: forged-wrong-key
        file: research/email-recovery/eval/network/attacks.mjs
      - test: replay-another-account
        file: research/email-recovery/eval/network/attacks.mjs
      - test: replay-another-controller
        file: research/email-recovery/eval/network/attacks.mjs
      - test: statement-other-new-key
        file: research/email-recovery/eval/network/attacks.mjs
      - test: registry-planted-key-in-timelock
        file: research/email-recovery/eval/network/attacks.mjs
      - test: registry-pin-expiry
        file: research/email-recovery/eval/network/attacks.mjs
      - test: quirks-each-provider
        file: research/email-recovery/eval/network/attacks.mjs
      - test: alerts-lapsed-push
        file: research/email-recovery/eval/network/attacks.mjs
      - test: social-phished-holds-passkey
        file: research/email-recovery/eval/network/attacks.mjs
      - test: social-phished-lost-devices
        file: research/email-recovery/eval/network/attacks.mjs
      - test: griefing-repeated-attempts
        file: research/email-recovery/eval/network/attacks.mjs

  - id: registry-timelock-attacks
    statement: >-
      A key planted in the registry that has passed its timelock still cannot
      approve for an account whose account code the attacker lacks; revoking
      an active key refuses every root holding it in the same ledger; and a
      superseded root is refused one ledger after its grace period ends.
      Tested on the integration-test host with the registry's real timelocks,
      not on a network.
    status: tested
    evidence:
      - test: registry_planted_key_after_activation_without_account_code
        file: crates/integration-tests/tests/it/email_guardian.rs
      - test: registry_revoked_active_key
        file: crates/integration-tests/tests/it/email_guardian.rs
      - test: registry_grace_expiry
        file: crates/integration-tests/tests/it/email_guardian.rs

  - id: compromised-inbox-alerted
    statement: >-
      With the email guardian as the only guardian, under the lost-key
      profile and a seven-day delay, an attacker who holds the inbox and the
      account code can authorize a recovery attempt but cannot complete it
      within the delay; a cancellation by the owner's passkey within the
      delay succeeds; the owner is alerted by Web Push to the passkey device,
      which reaches the owner when the attacker deletes every email sent to
      the inbox; an email vote that leaves an attempt below quorum is alerted
      on every channel; and a watcher that missed the events alerts the
      authorized attempt from controller state after it restarts.
    status: tested
    evidence:
      - test: inbox-email-plus-delay
        file: research/email-recovery/eval/network/attacks.mjs
      - test: inbox-email-vote-alerted
        file: research/email-recovery/eval/network/attacks.mjs
      - test: alerts-watcher-outage
        file: research/email-recovery/eval/network/attacks.mjs

  - id: front-running-one-vote
    statement: >-
      An email approval copied and submitted first by someone else records
      the guardian's single vote for the same attempt, and cannot be
      redirected to a cancellation, another attempt or another account.
    status: tested
    evidence:
      - test: front-running-copy-first
        file: research/email-recovery/eval/network/attacks.mjs
      - test: front-running-redirect
        file: research/email-recovery/eval/network/attacks.mjs

  - id: browser-proving-cost
    statement: >-
      In headless Chrome 151 on the same desktop, the wallet's own prover
      worker proves a recovery email in 1.48 seconds on 18 threads and 8.42
      seconds on one (median of five warm runs), 2.92 and 9.96 seconds from the
      page's request to the locally verified proof, with Barretenberg using 805
      and 738 MiB and the renderer peaking at 2,616 and 1,468 MiB; phone-class
      devices are not measured.
    status: measured
    evidence:
      - file: research/email-recovery/eval/results/proving.json
      - file: research/email-recovery/eval/browser-prover.md

  - id: network-verification-cost
    statement: >-
      On a local Stellar network, the 20 email votes with a real proof that
      leave their attempt collecting, each proven against its guardian's key
      pin, are metered at 119,948,955 to 120,081,003
      instructions (median 120,033,543) and declare about 124.9 million; each
      reads 12 ledger entries and writes 2 (1,208 bytes) in an 18,080-byte
      transaction, and is charged a median of 176,219 stroops, 2,604 of them
      rent.
    status: measured
    evidence:
      file: research/email-recovery/eval/results/attacks-local.json

  - id: testnet-email-recovery
    statement: >-
      On Stellar testnet, through Perch's deployment and Nido's factory and
      with the email-recovery contracts deployed from this repository, one
      complete email-factor recovery ran from enrollment to completion; its
      email vote, with a real proof against the guardian's key pin, was
      metered at 121,639,784 instructions
      (126,548,373 declared) in an 18,080-byte transaction charged 82,428
      stroops, 1,333 of them rent, 1,715 ms from simulation to confirmation.
    status: measured
    evidence:
      file: research/email-recovery/eval/results/testnet.json

  # Supporting results of the Lean model.
  - id: guardian-payload-irrelevant
    statement: >-
      The guardian's verdict does not depend on the authorization entry an
      approval is wrapped in, so whoever submits a copy of an approval gets
      the verdict the original would have had.
    status: proven
    evidence:
      lean: EmailRecovery.check_payload_irrelevant
      file: research/email-recovery/formal/EmailRecovery/Guardian.lean

  - id: digest-fixes-statement
    statement: >-
      A statement digest fixes one account, network, controller, action,
      attempt or request id and epoch, unless SHA-256 collides.
    status: proven
    evidence:
      lean: EmailRecovery.digest_fixes
      file: research/email-recovery/formal/EmailRecovery/Replay.lean

  - id: completion-waits-for-delay
    statement: >-
      In every trace of the controller model, every completed recovery is
      preceded by its attempt's authorization under a configuration with a
      positive delay, at least that many ledgers earlier.
    status: proven
    evidence:
      lean: EmailRecovery.Perch.completion_waits_for_delay
      file: research/email-recovery/formal/EmailRecovery/OneFactor.lean

  - id: owner-can-cancel
    statement: >-
      During the delay, a cancellation of a live attempt by the owner of a
      lost-key-profile account succeeds.
    status: proven
    evidence:
      lean: EmailRecovery.Perch.owner_can_cancel
      file: research/email-recovery/formal/EmailRecovery/OneFactor.lean

  - id: enrollment-subject-distinct
    statement: >-
      An enrollment email's Subject never satisfies the recovery circuit's
      Subject obligation.
    status: proven
    evidence:
      lean: EmailRecovery.enroll_subject_ne_recovery_subject
      file: research/email-recovery/formal/EmailRecovery/Circuit.lean

  - id: check-iff-accepted
    statement: >-
      The model's guardian check returns success exactly when the facts of
      its twelve checks hold, one per check.
    status: proven
    evidence:
      lean: EmailRecovery.check_eq_ok_iff
      file: research/email-recovery/formal/EmailRecovery/Guardian.lean

  - id: email-only-never-authorizes
    statement: >-
      Under a configuration with a quorum of at least two, or in combined or
      zk-only mode, approvals by the email guardian alone authorize no
      attempt.
    status: proven
    evidence:
      lean: EmailRecovery.Perch.email_only_never_authorizes
      file: research/email-recovery/formal/EmailRecovery/OneFactor.lean

  - id: email-alone-change-condition
    statement: >-
      The email guardian's approval alone meets the recovery condition for a
      Protected reconfiguration or upgrade only in guardian-only mode with
      quorum one.
    status: proven
    evidence:
      lean: EmailRecovery.Perch.quorum_one_of_conditionMet
      file: research/email-recovery/formal/EmailRecovery/OneFactor.lean

  - id: lean-axioms
    statement: >-
      The build pins every theorem's axiom dependencies: none depends on
      anything beyond Lean's built-in propext, Quot.sound and
      Classical.choice, and no proof is left open.
    status: tested
    evidence:
      test: guard_msgs
      file: research/email-recovery/formal/EmailRecovery/Axioms.lean

  # The circuit, the guardian and the registry, by component.
  - id: circuit-size
    statement: >-
      The recovery circuit has 251,561 UltraHonk gates (117,491 ACIR
      opcodes), padded to 2^18; the same relation at a 1024-byte header bound
      has 189,503 gates, also padded to 2^18; every proof is 16,224 bytes.
    status: measured
    evidence:
      file: circuits/email-recovery/MEASUREMENTS.md

  - id: header-bound-fits
    statement: >-
      With a 1536-byte header bound, the recovery email of every launch domain
      in its provider mock's format fits, and with a 124-byte address it still
      fits a display name of 536 bytes at the tightest provider (WEB.DE) and
      965 bytes at the loosest (Yahoo).
    status: measured
    evidence:
      file: circuits/email-recovery/README.md

  - id: circuit-vendoring
    statement: >-
      The circuit compiles only vendored noir-bignum and sha256 libraries and
      Perch's Poseidon2, each pinned file by file by checksums that a check in
      continuous integration fails on any drift, under the pinned nargo and
      Barretenberg; no header parser is reused.
    status: tested
    evidence:
      - test: check-vendor.sh
        file: .github/workflows/email-recovery-circuits.yml
      - test: check-toolchain.sh
        file: .github/workflows/email-recovery-circuits.yml

  - id: circuit-dkim-rules
    statement: >-
      The circuit refuses simple header canonicalization, an h= list without
      From or Subject, a second From or Subject field, a field outside the
      signed block, a d= that differs from the From domain, and a signature
      not below its modulus.
    status: tested
    evidence:
      - test: simple_header_canonicalization_is_refused
        file: circuits/email-recovery/tests/src/soundness.nr
      - test: h_without_from_is_refused
        file: circuits/email-recovery/tests/src/soundness.nr
      - test: two_from_fields_are_refused
        file: circuits/email-recovery/tests/src/soundness.nr
      - test: unsigned_field_cannot_be_added
        file: circuits/email-recovery/tests/src/soundness.nr
      - test: third_party_signing_domain_is_refused
        file: circuits/email-recovery/tests/src/soundness.nr
      - test: signature_plus_modulus_is_refused
        file: circuits/email-recovery/tests/src/soundness.nr

  - id: circuit-from-grammar
    statement: >-
      The circuit reads the From address only as a bare address or as the one
      angle-bracketed address that ends the field; a decoy address in the
      display name, a quoted local part, a comment and a value spanning into
      the next field are refused.
    status: tested
    evidence:
      - test: decoy_angle_addr_in_display_name_is_refused
        file: circuits/email-recovery/tests/src/soundness.nr
      - test: address_like_display_name_cannot_be_claimed
        file: circuits/email-recovery/tests/src/soundness.nr
      - test: quoted_local_part_is_refused
        file: circuits/email-recovery/tests/src/soundness.nr
      - test: from_value_cannot_span_into_the_next_field
        file: circuits/email-recovery/tests/src/soundness.nr

  - id: circuit-issue-classes
    statement: >-
      The circuit library's 123 tests include a negative test for each
      publicly documented soundness issue class of open-source email circuits,
      each refused at its named assertion.
    status: tested
    evidence:
      - test: folded_from_under_simple_canonicalization_is_refused
        file: circuits/email-recovery/tests/src/soundness.nr
      - test: from_text_inside_another_field_cannot_be_claimed
        file: circuits/email-recovery/tests/src/soundness.nr
      - test: bh_inside_another_tag_cannot_be_listed
        file: circuits/email-recovery/tests/src/soundness.nr
      - test: l_tag_does_not_affect_the_header_only_proof
        file: circuits/email-recovery/tests/src/soundness.nr
      - test: bytes_past_the_signed_length_are_refused
        file: circuits/email-recovery/tests/src/soundness.nr
      - test: two_subject_fields_are_refused
        file: circuits/email-recovery/tests/src/soundness.nr

  - id: subject-blinding
    statement: >-
      The circuit accepts a Subject only as the fixed recovery phrase followed
      by the 64 lowercase hexadecimal characters of T, the Poseidon2 hash of
      the blinding tag, the two digest limbs and the browser's value rho; a
      Subject under another rho, an encoded word, a reply prefix or trailing
      text is refused.
    status: tested
    evidence:
      - test: another_rho_is_refused
        file: circuits/email-recovery/tests/src/recovery_tests.nr
      - test: encoded_word_is_refused
        file: circuits/email-recovery/tests/src/subject_tests.nr
      - test: reply_prefix_is_refused
        file: circuits/email-recovery/tests/src/subject_tests.nr
      - test: trailing_text_is_refused
        file: circuits/email-recovery/tests/src/subject_tests.nr
      - test: the blinded digest is the Subject value the circuit vectors open
        file: packages/email-recovery/test/recoveryInputs.test.ts

  - id: registry-hash-parity
    statement: >-
      The registry's key hashes, leaves and roots, computed with the Soroban
      host's Poseidon2, equal those the circuit computes, and those of an
      independent Noir implementation.
    status: tested
    evidence:
      - test: noir_vectors
        file: contracts/dkim-registry/src/test.rs
      - test: roots_match_the_registry
        file: circuits/email-recovery/tests/src/registry_parity.nr

  - id: guardian-checks
    statement: >-
      The email guardian refuses an approval at the first failing check of
      twelve (one controller call carrying a digest; the statement hashes to
      it; a well-formed statement for this network, account and controller;
      an allowed action through its entry point; not expired; a canonical
      key root that is the live pin or a registry-accepted root; a proof that
      verifies), and builds every public input from its own configuration,
      the authorized digest and the accepted root.
    status: tested
    evidence:
      - test: refuses_anything_but_one_controller_call_carrying_a_digest
        file: contracts/email-guardian/src/test.rs
      - test: refuses_a_statement_that_is_not_the_digest_preimage
        file: contracts/email-guardian/src/test.rs
      - test: refuses_bytes_that_are_not_a_statement
        file: contracts/email-guardian/src/test.rs
      - test: refuses_a_statement_for_another_network
        file: contracts/email-guardian/src/test.rs
      - test: refuses_a_statement_for_another_account
        file: contracts/email-guardian/src/test.rs
      - test: refuses_a_statement_for_another_controller
        file: contracts/email-guardian/src/test.rs
      - test: refuses_a_disallowed_action
        file: contracts/email-guardian/src/test.rs
      - test: refuses_an_action_through_the_other_entry_point
        file: contracts/email-guardian/src/test.rs
      - test: refuses_an_expired_statement
        file: contracts/email-guardian/src/test.rs
      - test: refuses_a_non_canonical_root
        file: contracts/email-guardian/src/test.rs
      - test: refuses_a_root_the_registry_does_not_accept
        file: contracts/email-guardian/src/test.rs
      - test: builds_public_inputs_from_its_own_values_only
        file: contracts/email-guardian/src/test.rs
      - test: refuses_a_tampered_proof
        file: contracts/email-guardian/src/test.rs

  - id: guardian-construction
    statement: >-
      The guardian's constructor refuses an account that is not a contract,
      the account as its own controller, a zero or non-canonical commitment,
      an expired pin or one valid for more than 365 days (6,307,200 ledgers),
      an empty or unknown action set, and a verifier for another circuit.
    status: tested
    evidence:
