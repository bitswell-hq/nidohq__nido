  # The circuit's reading of real and fuzzed headers (eval/parser/).
  - id: parser-real-mail
    statement: >-
      On 5,327 DKIM-Signature fields of 5,154 real posts from all 11 launch
      domains in 18 public mailing-list archives, verified under the
      providers' real keys, the circuit agrees on every signature with
      reference implementations (mailauth's strict DKIM verifier, RSA by
      node:crypto, Python's standard-library address parser): 4,619 are accepted by both with
      the same address and domain and every other one is refused by both; the
      committed recovery artifact agrees with the test harness on all 10,320
      executions. These are list archives' copies of ordinary posts, not
      recovery mail, and no Fastmail signature verifies under any key DNS or
      zkEmail's public archive holds, so Fastmail is covered only on the
      refusing side.
    status: measured
    evidence:
      file: research/email-recovery/eval/parser/results/differential.json

  - id: parser-fuzzing
    statement: >-
      Over 50,000 seeded header blocks around the From grammar and the
      DKIM-Signature tag list (49,779 signatures with a test-only key), every
      From value the circuit accepts is read by Python's standard-library
      address parser as exactly the mailbox it binds; 22,409 signatures are accepted and 23,967
      refused by both the circuit and mailauth's strict verifier; the circuit
      also accepts 2,692 fields that the DKIM standard tells verifiers to
      ignore for a defect in a tag the circuit does not read, which only the
      holder of the signing key can write, and refuses 711 that the standard
      allows, for whitespace in a tag it reads. The committed recovery artifact agrees
      with the harness on all 1,994 cross-checked signatures and refuses an
      address list, an address before the angle-addr, a quoted word before an
      address and an unclosed quoted string at its display-name check.
    status: measured
    evidence:
      - file: research/email-recovery/eval/parser/results/fuzz.json
      - file: research/email-recovery/eval/parser/results/from-finding.json

  # The wallet's safeguards around the human steps (spec 5.4, 5.6, 5.7, 10.2, 11.4).
  - id: phishing-defences
    statement: >-
      The recovery email the wallet prepares opens with a line telling a user
      who was talked into sending it to stop; where the recovery code is
      typed, the page says nobody from Nido will ask for it and to check that
      the address bar shows exactly the recovery page the kit names, on
      Nido's apex, a constant of the build; no alert says that a matching
      code means nothing needs doing, the push for an authorized attempt
      leads with cancelling, and every required alert, email and push, says
      that whoever told the reader to expect it, or to ignore it, is trying
      to take the account. The page's warnings help an honest user; only the
      alerts reach a user talked into the attack.
    status: tested
    evidence:
      - test: the body opens by telling a talked-into sender to stop
        file: packages/frontend/src/lib/recovery/emailModel.test.ts
      - test: the code entry says nobody asks for it and how to check the origin against the kit
        file: packages/frontend/src/lib/recovery/emailModel.test.ts
      - test: "attempt_authorized: the push leads with cancelling, both pre-empt a caller, the email says who never asks for what, no code match reassures"
        file: infra/email-alerts/test/alerts.test.ts
      - test: every required alert pre-empts a caller; informational ones do not
        file: infra/email-alerts/test/alerts.test.ts

  - id: wallet-live-attempts
    statement: >-
      Whenever it opens, the wallet reads every live attempt of the account
      from the controller, collecting and authorized, independently of the
      alert service, paging down from the newest until the first collecting
      one that is not live; it lists those the email helper voted on first,
      and warns above the list when more than eight are open; a device
      holding the passkey is told it needs no recovery and offered the
      owner's cancellation, and an email vote is called out.
    status: tested
    evidence:
      - test: finds collecting and authorized attempts that are live, newest first, stops at the first closed one, and reads the authorized one
        file: packages/frontend/src/lib/recovery/liveAttempts.test.ts
      - test: "pages through every open attempt: an email vote under forty newer attempts is found and listed first"
        file: packages/frontend/src/lib/recovery/liveAttempts.test.ts
      - test: a device with the passkey is told it needs no recovery and offered the cancel; an email vote is called out
        file: packages/frontend/src/lib/recovery/liveAttempts.test.ts
      - test: griefing-then-vote
        file: research/email-recovery/eval/network/attacks.mjs

  - id: enrollment-safeguards
    statement: >-
      Enrollment continues only after two groups of the recovery kit's code,
      picked at random, are typed back with the code off the screen; on an
      iPhone or iPad the kit is printed first, and the page says that a
      download goes to iCloud Drive; the kit names its account, its recovery
      page and Nido's apex, and advises keeping it outside the inbox
      provider's account; the alert address starts empty, and the enrolled
      inbox draws a warning; an inbox at the platform that likely syncs the
      passkey draws a note recommending another inbox or helper; the page
      says what the mail provider and a chain watcher can tell, and names the
      services that deliver alerts; and recovery settings check a typed code
      against the guardian's pin root, storing and sending nothing.
    status: tested
