name = "attenuating-grants"
defaultTargets = ["AttenuatingGrants"]

[leanOptions]
autoImplicit = false

# Aeneas's Lean library: the models of Rust's core and alloc that the
# extracted evaluator (AttenuatingGrants/Extracted) is written against. The rev
# is the Aeneas commit scripts/extract.sh runs, so the library and the
# generated code always come from the same Aeneas.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
rev = "ab34bd28458a08c150b7cbf1873e59af74588138"
subDir = "backends/lean"

[[lean_lib]]
name = "AttenuatingGrants"
