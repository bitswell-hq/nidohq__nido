[package]
name = "nido-evaluation-agent-host"
description = "The attenuating-grants evaluation at the agent host: a research agent's workload, the attack suite with clean-failure checks, and per-check cost and throughput."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "nido-eval-agent-host"
path = "src/main.rs"

[dependencies]
agent-host = { path = "../../crates/agent-host" }
nido-key-keeper = { path = "../../crates/key-keeper" }
stellar-xdr = { version = "27", default-features = false, features = ["std"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

# Its own workspace, beside crates/agent-host's (whose README says why that
# one cannot join the root workspace), with the same release settings.
[workspace]
resolver = "3"

[profile.release]
overflow-checks = true
