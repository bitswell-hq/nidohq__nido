[package]
name = "nido-grant-signer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# `lib` as well as `cdylib`: the integration tests link the crate for its
# types and client while deploying the contract from its wasm.
[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
# `alloc`: rule-eval's rules, contexts and budget tree are `alloc` vectors.
soroban-sdk = { workspace = true, features = ["alloc"] }
rule-eval = { workspace = true }
# `StoredRule`, the form a Perch account's `scope_rule_set` returns rules in,
# and the conversions of host values and contexts to rule-eval's.
perch-rule-eval = { workspace = true }
# OpenZeppelin's `Signer`, which `StoredRule` and `Step::RemoveSigners` hold.
stellar-accounts = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils", "alloc"] }
grant-eval = { path = "../../crates/grant-eval" }
rule-eval-conformance = { workspace = true }
