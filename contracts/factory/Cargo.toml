[package]
name = "nido-factory"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true, features = ["hazmat-address"] }
stellar-accounts = { workspace = true }
soroban-sdk-tools = { workspace = true }
admin-sep = { workspace = true }

[build-dependencies]
# Reads the account hash out of Perch's deployment manifest (build.rs).
serde_json = "1"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = "2"
serde_json = "1"
